[build]
  command = "pip install -r src/backend/requirements.txt && cd src/frontend && npm install && npm run build"
  publish = "src/frontend/dist"

[functions]
  directory = "netlify/functions"
  # Python 3.9+ 사용 (Netlify 기본값 확인 필요하지만 명시 권장)
  # included_files = ["src/backend/**"] # 필요한 경우 소스 파일 포함 설정

[[redirects]]
  # API 요청은 Python Serverless Function으로 전달
  from = "/api/v1/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  # 나머지 요청은 React SPA(index.html)로 전달
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3000
