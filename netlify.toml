[build]
  base = "/"
  command = "pip install -r src/backend/requirements.txt && cd src/frontend && npm install && npm run build"
  publish = "src/frontend/dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
