[build]
  base = "/"
  # 
  # 루트에서 Functions 패키지도 설치해야 합니다.
  command = "npm install && cd src/frontend && npm install && npm run build"
  publish = "src/frontend/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # node 모듈을 번들에 명시적으로 포함
  external_node_modules = [] 

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true 

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
