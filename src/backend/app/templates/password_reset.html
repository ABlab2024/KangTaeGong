<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
        }

        .header {
            background: #dc3545;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        .alert-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .button {
            display: inline-block;
            background: #dc3545;
            color: white;
            padding: 14px 40px;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
            font-weight: bold;
        }

        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }

        .footer {
            background: #f5f5f5;
            padding: 20px;
            font-size: 11px;
            color: #666;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="alert-icon">⚠️</div>
            <h1>비밀번호 변경 필요</h1>
        </div>
        <div class="content">
            <p>안녕하세요, <strong>{{ recipient_name }}</strong>님</p>

            <div class="warning">
                <strong>보안 경고:</strong> 회원님의 계정에서 비정상적인 로그인 시도가 감지되었습니다.
            </div>

            <p>계정 보호를 위해 <strong>24시간 이내</strong>에 비밀번호를 변경해주세요.</p>
            <p>비밀번호를 변경하지 않으면 계정이 일시적으로 잠길 수 있습니다.</p>

            <p style="text-align: center;">
                <a href="{{ tracking_url }}" class="button">지금 비밀번호 변경하기</a>
            </p>

            <p style="font-size: 12px; color: #666;">
                본인이 요청하지 않은 경우, 이 이메일을 무시하시고 고객센터로 연락주세요.
            </p>
        </div>
        <div class="footer">
            <p>본 메일은 보안 알림 목적으로 발송되었습니다.</p>
            <p>© 2024 보안팀. All rights reserved.</p>
        </div>
    </div>
    <img src="{{ pixel_url }}" width="1" height="1" style="display:none;" alt="">
</body>

</html>
