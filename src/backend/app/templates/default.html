<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; }
        .header { background: #0066cc; color: white; padding: 20px; text-align: center; }
        .content { padding: 30px; }
        .button { display: inline-block; background: #0066cc; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px; margin: 20px 0; }
        .footer { background: #f5f5f5; padding: 20px; font-size: 12px; color: #666; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>보안 알림</h1>
        </div>
        <div class="content">
            <p>안녕하세요, {{ recipient_name }}님</p>
            <p>{{ message | default('중요한 보안 알림이 있습니다. 아래 버튼을 클릭하여 확인해주세요.') }}</p>
            <p style="text-align: center;">
                <a href="{{ tracking_url }}" class="button">확인하기</a>
            </p>
            <p style="font-size: 12px; color: #666;">이 링크는 24시간 동안 유효합니다.</p>
        </div>
        <div class="footer">
            <p>본 메일은 발신 전용입니다.</p>
        </div>
    </div>
    <img src="{{ pixel_url }}" width="1" height="1" style="display:none;" alt="">
</body>
</html>
